<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Clicking Speec</title>
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <div class="title">
            <h1>Clicking Speed</h1>
        </div>

        <div class="options">
            <button class="time-option" data-duration="10">10 sec</button>
            <button class="time-option" data-duration="20">20 sec</button>
            <button class="time-option" data-duration="30">30 sec</button>
        </div>

        <div class="time">
            <span class="Time-Left"> 10 </span>
        </div>
        <!-- <div class = "start">
        <button class = "start-btn"> start </button>
    </div> -->

        <div class="play-area-div">
            <span class="play-area unselectable">
                <span class = 'start'> START </span>
                <span class="Restart"> Press Enter to Restart </span>
                <!--Active only after specific event-->
            </span>
        </div>

        <div class="cps-div">
            <p class="cps">
                <span> CPS : </span>
                <span class="cps-value"> 0 </span>
            </p>
        </div>

        <script src="script.js"></script>
    </body>
</html>
