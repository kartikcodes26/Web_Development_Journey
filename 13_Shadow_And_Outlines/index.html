<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shadow</title>

    <style>
        .box {
            border: 2px solid grey;
            background-color: #D3D3D3;
            color: black;
            min-height: 200px;
            text-align: center;
            box-shadow: 4px 4px 3px 0px gray;
            outline: 2px solid blue; /* Outline jagah nahi leta hai, border gagah leta hai */
            outline-offset: 4px;
        }
    </style>
</head>
<body>
    <div class = "box">
        This is a block element with a shadow.
    </div>
</body>
</html>
